# SpecSync 5 configuration
# Docs: https://github.com/CorvidLabs/spec-sync

specs_dir = "specs"
source_dirs = ["."]
source_extensions = ["md", "yml", "html"]
exclude_dirs = [".claude", ".codex", ".cursor", ".gemini", ".git", ".github", ".specsync", "scripts", "specs"]
exclude_patterns = ["AGENTS.md"]
required_sections = ["Purpose", "Public API", "Invariants", "Behavioral Examples", "Error Cases", "Dependencies", "Change Log"]
enforcement = "strict"

[lifecycle]
track_history = false
