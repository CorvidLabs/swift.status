name: Trust
on:
  pull_request:
jobs:
  trust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Fetch base branch
        run: git fetch origin "${{ github.event.pull_request.base.ref }}:refs/remotes/origin/${{ github.event.pull_request.base.ref }}"
      - name: CorvidLabs Trust gate
        uses: CorvidLabs/trust@e0272543ad5c88ec75cea1e606cc2efa552af25b # v1.2.0-rc.4
        with:
          range: "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
